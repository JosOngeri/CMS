name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci --production
      
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci  # devDeps required — vite lives in devDependencies
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          set -e
          cd /var/www/CMS
          git pull origin main
          cd backend
          npm ci --omit=dev
          cd ../frontend
          npm ci
          npm run build
          cd ../backend

          # Bootstrap the migration ledger on existing databases, then apply
          # pending numbered migrations. Idempotent — safe every deploy.
          node scripts/apply-migrations.js --mark-applied 049
          node scripts/apply-migrations.js

          # Platform JWT secret: church tokens use JWT_SECRET; platform tokens
          # need their own. Generate once on first deploy that has the code.
          grep -q '^PLATFORM_JWT_SECRET=' .env 2>/dev/null \
            || echo "PLATFORM_JWT_SECRET=$(openssl rand -hex 48)" >> .env

          pm2 restart kmaincms-backend
          # Caddy serves frontend/dist-new directly — no proxy restart needed

          # External uptime probe: pings the PUBLIC /api/health every 5 min
          # and records 'api.external' rows in platform_health — a stale
          # probe row (>15 min) surfaces as degraded on the status page.
          # Log goes under the project dir: the deploy user can't write /var/log.
          # Idempotent — strips any previous entry before re-adding.
          mkdir -p logs
          (crontab -l 2>/dev/null | grep -v 'uptimeProbe\.js'; \
            echo '*/5 * * * * cd /var/www/CMS && PROBE_URL=https://cms.josongeri.co.ke/api/health node backend/scripts/uptimeProbe.js >> logs/uptime-probe.log 2>&1') | crontab -
          
    - name: Verify deployment
      run: |
        # Poll the health endpoint — fail the run (and surface it in Actions)
        # if the app doesn't come back healthy after restart.
        for i in $(seq 1 12); do
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" https://cms.josongeri.co.ke/api/health)
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed on attempt $i"
            cat /tmp/health.json
            exit 0
          fi
          echo "Attempt $i: HTTP $STATUS — retrying in 10s"
          sleep 10
        done
        echo "Health check FAILED after 12 attempts"
        cat /tmp/health.json 2>/dev/null || true
        exit 1

    - name: Platform endpoint smoke sweep
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd /var/www/CMS/backend
          node scripts/platformSmokeSweep.js