name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci --production
      
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci --production
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
      
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          set -e
          cd /var/www/kmaincms
          git pull origin main
          cd backend
          npm ci --omit=dev
          cd ../frontend
          npm ci
          npm run build
          cd ../backend

          # Bootstrap the migration ledger on existing databases, then apply
          # pending numbered migrations (050+). Idempotent — safe every deploy.
          node scripts/apply-migrations.js --mark-applied 049
          node scripts/apply-migrations.js

          # Platform JWT secret: church tokens use JWT_SECRET; platform tokens
          # need their own. Generate once on first deploy that has the code.
          grep -q '^PLATFORM_JWT_SECRET=' .env 2>/dev/null \
            || echo "PLATFORM_JWT_SECRET=$(openssl rand -hex 48)" >> .env

          pm2 restart kmaincms-backend
          sudo systemctl restart nginx
          
    - name: Verify deployment
      run: |
        echo "Deployment completed successfully"
        echo "Application should be available at https://cms.josongeri.co.ke"