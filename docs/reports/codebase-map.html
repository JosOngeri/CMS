<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codebase Map</title>
<style>
  :root{
    --live:#3B82F6; --dead:#EF4444; --test:#8B5CF6; --script:#6B7280;
    --doc:#F59E0B; --code:#94A3B8;
    --bg:#FEFDFB; --surface:#FFFFFF; --text:#1F2937; --muted:#6B7280;
    --border:#E5E7EB; --focus:#2563EB;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
  header h1{font-size:20px} header .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  nav{display:flex;gap:4px;padding:8px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
  nav button{border:1px solid var(--border);background:var(--surface);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
  nav button[aria-selected="true"]{background:var(--live);color:#fff;border-color:var(--live)}
  main{padding:16px 24px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:150px}
  .card .v{font-size:22px;font-weight:700}.card .k{font-size:12px;color:var(--muted)}
  .bar-row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
  .bar-row .lbl{width:150px;text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:14px;border-radius:3px;display:flex;overflow:hidden;min-width:2px}
  .bar>div{height:100%}
  canvas{display:block;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px}
  .toolbar label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .toolbar input[type=text]{border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px;min-width:220px}
  #crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
  #crumb a{color:var(--live);cursor:pointer;text-decoration:none}
  #tip{position:fixed;pointer-events:none;background:#111827;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;display:none;z-index:50;max-width:420px;white-space:pre-line}
  table{width:100%;border-collapse:collapse;background:var(--surface);font-size:12px}
  th,td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left}
  th{cursor:pointer;user-select:none;position:sticky;top:49px;background:var(--surface)}
  th[aria-sort]{color:var(--live)}
  tr:hover td{background:#F8FAFC}
  tbody tr{cursor:pointer}
  .st{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:11px}
  .tablewrap{max-height:70vh;overflow:auto;border:1px solid var(--border);border-radius:8px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .note{color:var(--muted);font-size:12px;margin-top:6px}
  .btn{border:1px solid var(--border);background:var(--surface);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px}
  .btn:hover{background:#F3F4F6}
  /* ---- educational modal ---- */
  .backdrop{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--surface);border-radius:10px;max-width:640px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .modal header{padding:14px 18px 8px;border:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:0;background:var(--surface)}
  .modal header h2{font-size:17px}
  .modal .body{padding:0 18px 18px}
  .modal .body h4{margin:14px 0 4px;color:var(--live)}
  .modal .body p,.modal .body li{font-size:13px;color:#374151}
  .modal .body ul{margin:4px 0 8px 18px}
  .modal .body code{background:#F1F5F9;padding:1px 5px;border-radius:4px;font-size:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:8px 0}
  .kv b{color:var(--muted);font-weight:500}
  .x{border:0;background:#F3F4F6;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:15px;flex:none}
  .term{display:inline-block;border-bottom:1px dotted var(--muted);cursor:help}
  .learn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .learn-card{border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--surface);cursor:pointer}
  .learn-card:hover{border-color:var(--live)}
  .learn-card h4{margin-bottom:4px}
  .learn-card p{font-size:12px;color:var(--muted)}
  .why{background:#EFF6FF;border-left:3px solid var(--live);padding:8px 10px;border-radius:0 6px 6px 0;font-size:13px;margin-top:10px}
</style>
</head>

const LABEL={live:'Live',dead:'Dead',test:'Test',script:'Script',doc:'Docs/assets',code:'Unscanned'};

// ---------- data prep ----------
const files=DATA.files;
const byStatus={};let totLoc=0,totBytes=0;
files.forEach((f,i)=>{f.id=i;byStatus[f.status]=(byStatus[f.status]||0)+1;totLoc+=f.loc;totBytes+=f.bytes});

  `Generated ${new Date(DATA.generated).toLocaleString()} • ${files.length} files • ${totLoc.toLocaleString()} lines • ${(totBytes/1048576).toFixed(1)} MB`+

// ---------- dir tree ----------
function buildTree(){
  const root={name:'',children:new Map(),files:[],size:0,loc:0,dom:null,path:''};
  for(const f of files){
    const parts=f.path.split('/');let n=root;
    for(let i=0;i<parts.length-1;i++){
      if(!n.children.has(parts[i])){const d={name:parts[i],children:new Map(),files:[],size:0,loc:0,dom:null,path:(n.path?n.path+'/':'')+parts[i]};n.children.set(parts[i],d)}
      n=n.children.get(parts[i]);
    }
    n.files.push(f);
    for(let m=root,i=0;;){m.size+=f.bytes;m.loc+=f.loc;
      m.domCounts=m.domCounts||{};m.domCounts[f.status]=(m.domCounts[f.status]||0)+f.loc;
      if(i>=parts.length-1)break;m=m.children.get(parts[i++])}
  }
  (function setDom(n){let best='doc',bv=-1;for(const k in n.domCounts||{}){if(n.domCounts[k]>bv){bv=n.domCounts[k];best=k}}n.dom=best;n.children.forEach(setDom)})(root);
  return root;
}
const TREE=buildTree();

// ==================================================================
// EDUCATION LAYER — glossary + modal. Every technical term used in the
// map gets a plain-English card you can open from the Learn tab or by
// clicking any underlined term in a popup.
// ==================================================================
const GLOSSARY=[
 ['entry-point','Entry point',`The file where the program starts — for this repo,
  <code>frontend/src/main.jsx</code> (the React app) and <code>backend/server.js</code>
  (the Express server). The scanner marks a file <b>live</b> by walking the import
  chain starting here.`],
 ['dependency-graph','Dependency graph',`A map of which files need which other files.
  Each file is a <b>node</b>; each <code>import</code> or <code>require</code> is an
  <b>edge</b>. It's the same idea as a family tree: parents at the top, children below —
  except a file can have many parents.`],
 ['import','Import / edge',`When a file says <code>import X from './x'</code>, it creates
  a directed edge from that file to <code>x</code>. "Directed" means it only goes one way —
  <code>x</code> doesn't automatically know who imports it. The arrow direction matters
  for finding dead code.`],
 ['reachability','Reachability',`A file is reachable if you can get to it from the entry
  point by following imports — like following links from a homepage. If no chain of
  imports leads to a file, it can never run. The scanner does a breadth-first walk
  (like ripples spreading from a stone in water).`],
 ['dead-code','Dead code',`Unreachable code — nothing imports it, so it can never execute.
  It's not automatically "buggy": it's often old versions of files kept by accident,
  abandoned features, or experiments. Deleting it shrinks the codebase and removes
  confusion, but verify first — some files run via tests, scripts, or string-loaded paths.`],
 ['loc','LOC (lines of code)',`A rough size measure: how many lines the file has.
  It says nothing about quality — a 500-line file might be clear or a mess — but it's
  the standard cheap way to see where "bulk" lives in a project.`],
 ['imported-by','Imported by (dependents)',`How many files import THIS one. A high count
  means the file is a hub — many things break if you change it. Deleting a hub is
  dangerous; deleting a file nobody imports is usually safe.`],
 ['treemap','Treemap',`A space-filling chart: every file becomes a rectangle whose
  <b>area</b> is proportional to its size. Nested folders are nested rectangles.
  Invented by Ben Shneiderman in the 1990s — great for spotting "where is all the
  code concentrated?"`],
 ['sunburst','Sunburst / radial partition',`The same hierarchy as a treemap, drawn as
  rings. Centre = root folder; each ring outward = one level deeper; arc angle = size.
  Makes depth and folder balance easy to see at a glance.`],
 ['force-graph','Force-directed graph',`The dependency web. Nodes repel like magnets,
  edges act like springs pulling connected files together, and weak gravity holds
  everything near the centre. Over ~300 small physics steps the layout "relaxes" into
  clusters — tightly-connected files end up near each other, which is how architecture
  reveals itself.`],
 ['live-code','Live code',`Code reachable from an entry point. Being live doesn't mean
  it runs often — just that it CAN run.`],
 ['test-script','Tests & scripts',`<b>Tests</b> (purple) run standalone via a test runner —
  they're never imported by the app, so a naive scanner calls them "dead". We classify
  them separately so you don't delete them by mistake. <b>Scripts</b> (grey) are manual
  tools run by hand or CI — same story.`],
 ['regex-scan','Regex-based scanning',`This map reads imports using regular expressions —
  fast and dependency-free, but not a real parser. It can miss imports built from string
  concatenation (<code>import('./' + name)</code>). Treat a "dead" flag as a strong hint,
  not a verdict — grep the filename once before deleting.`],
 ['coupling','Coupling & cohesion',`Two files are <b>coupled</b> if one imports the other.
  High coupling across many unrelated areas usually means refactors are risky.
  <b>Cohesion</b> is whether things inside a file/folder belong together. In the Graph
  view, tight clusters = cohesive modules; one giant blob = high coupling.`],
 ['barrel','Barrel / index files',`An <code>index.js</code> that only re-exports its
  folder's modules (<code>export * from './a'</code>). The scanner treats them as
  regular files — if a folder looks "dead" but its index.js is live, check whether the
  index is the real door in.`],
 ['aria','ARIA (accessibility)',`<b>A</b>ccessible <b>R</b>ich <b>I</b>nternet
  <b>A</b>pplications — attributes like <code>role="dialog"</code> and
  <code>aria-label</code> that tell screen readers what visual things mean. This page
  uses them: tabs announce selection, the modal traps focus, canvases carry text
  descriptions. Visualizations are inherently visual, so the Files table doubles as the
  fully-accessible view of the same data.`],
];

// ---------- modal (accessible dialog) ----------
let lastFocus=null;
function openModal(title,html){
  lastFocus=document.activeElement;
  const bd=document.createElement('div');bd.className='backdrop';
  bd.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${title.replace(/"/g,'&quot;')}">
    <header><h2>${title}</h2><button class="x" aria-label="Close dialog">✕</button></header>
    <div class="body">${html}</div></div>`;
  document.body.appendChild(bd);
  const close=()=>{bd.remove();if(lastFocus)lastFocus.focus();document.removeEventListener('keydown',esc)};
  function esc(e){if(e.key==='Escape')close()}
  bd.querySelector('.x').onclick=close;
  bd.addEventListener('click',e=>{if(e.target===bd)close()});
  document.addEventListener('keydown',esc);
  // wire glossary term links inside
  bd.querySelectorAll('.term').forEach(t=>t.onclick=e=>{e.stopPropagation();openTerm(t.dataset.term)});
  bd.querySelector('.x').focus();
}
function term(t){return`<span class="term" role="button" tabindex="0" data-term="${t}">${t.replace(/-/g,' ')}</span>`}
function openTerm(name){
  const g=GLOSSARY.find(x=>x[0]===name);
  if(g)openModal(g[1],`<p>${g[2]}</p>
    <div class="why"><b>Why it matters here:</b> ${WHY[name]||'It is one of the lenses this map gives you over the codebase.'}</div>`);
}
const fmt=n=>(n||0).toLocaleString();
const WHY={
 'entry-point':'This map found '+((DATA.roots||[]).length)+' entr'+(DATA.roots&&DATA.roots.length===1?'y':'ies')+' and walked every import from there. If an entry is wrong or missing, live/dead numbers shift.',
 'dependency-graph':'The Graph view IS this graph drawn physically. Red dots = nodes no live path reaches.',
 'reachability':'This is the algorithm that produced the blue/red split: '+fmt((byStatus.live||0))+' reachable, '+fmt((byStatus.dead||0))+' unreachable files.',
 'dead-code':'Your repo has '+fmt((byStatus.dead||0))+' dead files. The verified list lives in docs/plans/dead-code-verification.md.',
 'imported-by':'Sort the Files table by "Imported by" — the top rows are your project\'s load-bearing walls.',
 'regex-scan':'If a "dead" file looks real (e.g. loaded lazily by string), that\'s this limitation showing itself.',

function fileModal(f){
  const importers=files.filter(x=>x.i.includes(f.id)).slice(0,15);
  const deps=f.i.slice(0,15).map(i=>files[i]);
  openModal(f.name,`
    <p style="color:var(--muted);font-size:12px;word-break:break-all">${f.path}</p>
    <div class="kv">
      <b>Status</b><span><span class="st" style="background:${COLORS[f.status]}">${LABEL[f.status]}</span></span>
      <b>${term('loc')}</b><span>${f.loc.toLocaleString()}</span>
      <b>Size</b><span>${(f.bytes/1024).toFixed(1)} KB</span>
      <b>Imports</b><span>${f.i.length} file${f.i.length===1?'':'s'} (this file depends on them)</span>
      <b>${term('imported-by')}</b><span>${f.importedBy} file${f.importedBy===1?'':'s'} (they depend on this file)</span>
    </div>
    ${f.status==='dead'?`<div class="why"><b>Why is it red?</b> No chain of ${term('import')} edges reaches this file from the
      ${term('entry-point')}. That means it can never run in the app — see ${term('reachability')} and ${term('dead-code')}.
      Before deleting, do one repo-wide search for <code>${f.name.replace(/\.\w+$/,'')}</code> to catch string-loaded refs
      (${term('regex-scan')} limitation).</div>`:''}
    ${f.status==='live'&&f.importedBy>5?`<div class="why"><b>Hub file:</b> ${f.importedBy} files depend on this —
      changes here ripple widely. High ${term('coupling')} risk; edit carefully.</div>`:''}
    ${f.i.length?`<h4>Imports (${f.i.length})</h4><ul>${deps.map(d=>`<li>${d.path}</li>`).join('')}${f.i.length>15?'<li>…</li>':''}</ul>`:''}
    ${importers.length?`<h4>Imported by (${f.importedBy})</h4><ul>${importers.map(d=>`<li>${d.path}</li>`).join('')}${f.importedBy>15?'<li>…</li>':''}</ul>`:''}`);
}

  h+='</div>';
  h+='<h3 style="margin:14px 0 6px">Size by top-level folder</h3>';
  const groups={};
  for(const f of files){const k=f.path.split('/')[0];groups[k]=groups[k]||{loc:0,by:{}};groups[k].loc+=f.loc;groups[k].by[f.status]=(groups[k].by[f.status]||0)+f.loc}
  const top=Object.entries(groups).sort((a,b)=>b[1].loc-a[1].loc).slice(0,14);
  const max=top.length?top[0][1].loc:1;
  for(const [k,g] of top){
    const w=Math.max(2,g.loc/max*100);
    h+=`<div class="bar-row"><span class="lbl">${k}/</span><div class="bar" style="width:${w}%">`+
       ORDER.filter(s=>g.by[s]).map(s=>`<div style="width:${g.by[s]/g.loc*100}%;background:${COLORS[s]}" title="${LABEL[s]} ${g.by[s].toLocaleString()} LOC"></div>`).join('')+
       `</div><span>${g.loc.toLocaleString()}</span></div>`;
  }
  h+='<h3 style="margin:18px 0 6px">Largest files</h3>';
  const big=[...files].sort((a,b)=>b.loc-a.loc).slice(0,10);
  h+=big.map(f=>`<div class="bar-row"><span class="lbl" title="${f.path}">${f.name}</span>`+
    `<div class="bar" style="width:${f.loc/big[0].loc*100}%;background:${COLORS[f.status]}"></div>`+
    `<span>${f.loc.toLocaleString()} LOC</span></div>`).join('');
  h+='<p class="note">Tip: red bars = dead code concentration. Click any folder bar into the Treemap tab to zoom in.</p>';
  view.innerHTML=h;
}

// ============ canvas helper ============
function mkCanvas(h,label,desc){
  view.querySelectorAll('canvas,p.canv-desc').forEach(n=>n.remove());
  const c=document.createElement('canvas');
  c.setAttribute('role','img');c.setAttribute('aria-label',label);
  const w=view.clientWidth-2;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;
  c.style.height=h+'px';view.appendChild(c);
  const d=document.createElement('p');d.className='sr-only canv-desc';d.textContent=desc;
  view.appendChild(d);
  const g=c.getContext('2d');g.scale(devicePixelRatio,devicePixelRatio);return[c,g,w,h];
}

// ============ TREEMAP ============
function squarify(items,x,y,w,h,out){
  items.sort((a,b)=>b.v-a.v);
  const total=items.reduce((s,i)=>s+i.v,0);
  if(!total||w<=0||h<=0)return;
  let row=[],rx=x,ry=y,rw=w,rh=h;
  const areaScale=w*h/total;
  function worst(row,side){
    let mn=Infinity,mx=0,s=row.reduce((t,i)=>t+i.v*areaScale,0);
    for(const i of row){const a=i.v*areaScale;mn=Math.min(mn,a);mx=Math.max(mx,a)}
    const S=side*side;return Math.max(S*mx/(s*s),s*s/(S*mn));
  }
  for(const it of items){
    const side=Math.min(rw,rh);
    if(row.length&&worst([...row,it],side)>worst(row,side)){layoutRow();row=[]}
    row.push(it);
  }
  if(row.length)layoutRow();
  function layoutRow(){
    const s=row.reduce((t,i)=>t+i.v*areaScale,0);
    if(rw>=rh){const cw=s/rh;
      for(const i of row){const chh=i.v*areaScale/cw;out.push({node:i.node,x:rx,y:ry,w:cw,h:chh});ry+=chh}
      rx+=cw;rw-=cw;ry=y;
    }else{const ch=s/rw;let cx=rx;
      for(const i of row){const cww=i.v*areaScale/ch;out.push({node:i.node,x:cx,y:ry,w:cww,h:ch});cx+=cww}
      ry+=ch;rh-=ch;rx=x;
    }
  }
}
let tmNode=TREE,tmMode='loc';
function vTreemap(){
  view.innerHTML=`<div class="toolbar">${helpBtn('treemap')}
    <label>Size by: <select id="tmm"><option value="loc">Lines of code</option><option value="size">Bytes</option></select></label>
    <span style="color:var(--muted)">Click a folder to zoom in • click a file for details • use the path to zoom out</span></div>
    <div id="crumb"></div>`;
  const desc=`Treemap of ${DATA.repo}. ${files.length} files sized by lines of code. Colours: blue live, red dead, purple test, grey script, amber docs.`;
  const [c,g]=mkCanvas(Math.min(720,Math.max(420,innerHeight-240)),'Treemap of the repository',desc);
  const metric=n=>tmMode==='loc'?n.loc:n.size;
  function crumbs(){
    const parts=tmNode.path?tmNode.path.split('/'):[];let h=`<a data-p="">root</a>`;
    parts.forEach((p,i)=>h+=` / <a data-p="${parts.slice(0,i+1).join('/')}">${p}</a>`);
    const cr=document.getElementById('crumb');cr.innerHTML=h;
    cr.querySelectorAll('a').forEach(a=>a.onclick=()=>{tmNode=findNode(a.dataset.p);draw()});
  }
  function findNode(p){let n=TREE;for(const seg of p?p.split('/'):[])n=n.children.get(seg);return n}
  function draw(){
    crumbs();
    const items=[...tmNode.children.values()].map(d=>({v:metric(d),node:d}))
      .concat(tmNode.files.map(f=>({v:tmMode==='loc'?f.loc:f.bytes,node:f}))).filter(i=>i.v>0);
    const rect=[];squarify(items,0,0,c.width/devicePixelRatio,c.height/devicePixelRatio,rect);
    g.clearRect(0,0,c.width,c.height);
    for(const r of rect){
      const isDir=!!r.node.children;const col=isDir?COLORS[r.node.dom]:COLORS[r.node.status];
      g.fillStyle=col;g.globalAlpha=isDir?0.75:0.9;
      g.fillRect(r.x+1,r.y+1,Math.max(0,r.w-2),Math.max(0,r.h-2));g.globalAlpha=1;
      if(r.w>46&&r.h>14){
        g.fillStyle='#fff';g.font='10px sans-serif';
        const nm=isDir?r.node.name+'/':r.node.name;
        g.fillText(nm.length>r.w/6?nm.slice(0,r.w/6-1)+'…':nm,r.x+4,r.y+12);
        if(r.h>26){g.font='9px sans-serif';g.fillText(r.node.loc.toLocaleString()+' LOC',r.x+4,r.y+23)}
      }
    }
    c._rect=rect;
  }
  document.getElementById('tmm').onchange=e=>{tmMode=e.target.value;draw()};
  c.onmousemove=e=>{const b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
    const r=(c._rect||[]).find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);
    if(r){const n=r.node,isDir=!!n.children;
      showTip(e,(n.path||n.name)+(isDir?'/':'')+'\n'+(n.loc||0).toLocaleString()+' LOC • '+(n.bytes/1024).toFixed(0)+' KB\n'+
        (isDir?`${n.files.length} files here • dominant: ${LABEL[n.dom]}`:LABEL[n.status]));
      c.style.cursor='pointer'}
    else{hideTip();c.style.cursor='default'}};
  c.onmouseleave=hideTip;
  c.onclick=e=>{const b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
    const r=(c._rect||[]).find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);
    if(!r)return;
    if(r.node.children)tmNode=r.node,draw();
    else fileModal(r.node)};
  draw();
}

// ============ SUNBURST ============
let sbNode=TREE;
function vSunburst(){
  view.innerHTML=`<div class="toolbar">${helpBtn('sunburst')}
    <span style="color:var(--muted)">Rings = folder depth • arc size = LOC • click a folder to zoom, click centre for root</span></div>
    <div id="crumb"></div>`;
  const desc=`Sunburst chart of the folder hierarchy. Each ring is one directory level deeper; arc width is proportional to lines of code.`;
  const [c,g]=mkCanvas(Math.min(760,Math.max(460,innerHeight-220)),'Sunburst chart of the repository',desc);
  const W=c.width/devicePixelRatio,H=c.height/devicePixelRatio,cx=W/2,cy=H/2;
  const R=Math.min(W,H)/2-8;
  function depth(n){let d=1;n.children.forEach(ch=>d=Math.max(d,depth(ch)));return d}
  let arcs=[];
  function draw(){
    arcs=[];g.clearRect(0,0,W,H);
    const parts=sbNode.path?sbNode.path.split('/'):[];
    document.getElementById('crumb').innerHTML=`<a id="sbroot">root</a>`+parts.map(p=>` / ${p}`).join('');
    document.getElementById('sbroot').onclick=()=>{sbNode=TREE;draw()};
    const D=depth(sbNode),ring=R/D;
    (function lay(n,a0,a1,lvl){
      if(!n.loc)return;
      if(lvl>0){const isDir=!!n.children.size;
        arcs.push({n,a0,a1,r0:ring*(lvl-1),r1:ring*lvl});
        g.beginPath();
        g.arc(cx,cy,ring*lvl,a0,a1);g.arc(cx,cy,ring*(lvl-1),a1,a0,true);g.closePath();
        g.fillStyle=COLORS[n.dom];
        g.globalAlpha=isDir?0.8:0.9;g.fill();g.globalAlpha=1;
        g.strokeStyle='#fff';g.lineWidth=1;g.stroke();
        if(a1-a0>0.12&&ring>24){g.save();g.fillStyle='#fff';g.font='9px sans-serif';
          const mid=(a0+a1)/2,rr=ring*(lvl-0.5);g.translate(cx+Math.cos(mid)*rr,cy+Math.sin(mid)*rr);
          g.rotate(mid+Math.PI/2);const nm=n.name+'';
          g.fillText(nm.length>14?nm.slice(0,13)+'…':nm,-nm.length*2.5,3);g.restore()}
      }
      const kids=[...n.children.values()];let a=a0;
      for(const k of kids){const span=(a1-a0)*k.loc/n.loc;lay(k,a,a+span,lvl+1);a+=span}
      for(const f of n.files){const span=(a1-a0)*f.loc/n.loc;
        arcs.push({n:f,a0:a,a1:a+span,r0:ring*lvl,r1:ring*(lvl+1),isFile:true});
        g.beginPath();g.arc(cx,cy,ring*(lvl+1),a,a+span);g.arc(cx,cy,ring*lvl,a+span,a,true);g.closePath();
        g.fillStyle=COLORS[f.status];g.globalAlpha=.9;g.fill();g.globalAlpha=1;g.strokeStyle='#fff';g.stroke();
        a+=span}
    })(sbNode,0,Math.PI*2,0);
    g.beginPath();g.arc(cx,cy,ring*0.9,0,7);g.fillStyle=COLORS[sbNode.dom];g.fill();
    g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='center';
    g.fillText(sbNode.name||'root',cx,cy-2);g.font='9px sans-serif';
    g.fillText(sbNode.loc.toLocaleString()+' LOC',cx,cy+11);g.textAlign='left';
  }
  c.onmousemove=e=>{const b=c.getBoundingClientRect();const dx=e.clientX-b.left-cx,dy=e.clientY-b.top-cy;
    const r=Math.hypot(dx,dy);let a=Math.atan2(dy,dx);if(a<0)a+=Math.PI*2;
    const hit=arcs.find(s=>r>=s.r0&&r<=s.r1&&a>=s.a0&&a<=s.a1);
    if(hit){const n=hit.n;
      showTip(e,(n.path||n.name)+(hit.isFile?'':'/')+'\n'+(n.loc||0).toLocaleString()+' LOC\n'+
        (hit.isFile?LABEL[n.status]:'dominant: '+LABEL[n.dom]));
      c.style.cursor='pointer'}else{hideTip();c.style.cursor='default'}};
  c.onmouseleave=hideTip;
  c.onclick=e=>{const b=c.getBoundingClientRect();const dx=e.clientX-b.left-cx,dy=e.clientY-b.top-cy;
    const r=Math.hypot(dx,dy);
    const ring=(Math.min(W,H)/2-8)/Math.max(1,depth(sbNode));
    if(r<=ring){if(sbNode!==TREE){sbNode=TREE;draw()}return}
    let a=Math.atan2(dy,dx);if(a<0)a+=Math.PI*2;
    const hit=arcs.find(s=>r>=s.r0&&r<=s.r1&&a>=s.a0&&a<=s.a1);
    if(!hit)return;
    if(hit.isFile)fileModal(hit.n);
    else if(hit.n.children&&hit.n.children.size){sbNode=hit.n;draw()}};
  draw();
}

// ============ GRAPH ============
function vGraph(){
  view.innerHTML=`<div class="toolbar">${helpBtn('graph')}
    <label><input type="checkbox" id="gd" checked> show dead</label>
    <label><input type="checkbox" id="gt"> show tests/scripts</label>
    <span style="color:var(--muted)">drag dots • wheel zoom • click a dot for details</span>
    <span id="gstat" style="color:var(--muted)" aria-live="polite"></span></div>`;
  const desc='Force-directed graph of the code dependency network. Each node is a file; each edge is an import.';
  const [c,g]=mkCanvas(Math.min(720,Math.max(460,innerHeight-240)),'Dependency graph',desc);
  const W=c.width/devicePixelRatio,H=c.height/devicePixelRatio;
  let nodes=[],edges=[],cam={x:W/2,y:H/2,k:1},hover=null,iter=0,raf=null;
  function rebuild(){
    const sd=document.getElementById('gd').checked,st=document.getElementById('gt').checked;
    const keep=new Set();
    files.forEach(f=>{const ok=f.status==='live'||(sd&&f.status==='dead')||(st&&(f.status==='test'||f.status==='script'));
      if(ok&&(f.status!=='doc'&&f.status!=='code'))keep.add(f.id)});
    nodes=[...keep].map(id=>{const f=files[id];
      return{id,x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,f,r:2.5+Math.min(6,Math.sqrt(f.loc)/14)}});
    const nid=new Map(nodes.map((n,i)=>[n.id,i]));
    edges=[];
    for(const n of nodes)for(const t of files[n.id].i)if(nid.has(t))edges.push([nid.get(n.id),nid.get(t)]);
    document.getElementById('gstat').textContent=`${nodes.length} files • ${edges.length} imports — laying out…`;
    iter=0;if(raf)cancelAnimationFrame(raf);layout();
  }
  function layout(){
    const N=nodes.length;
    function tick(){
      for(let k=0;k<8;k++){
        iter++;
        for(let i=0;i<N;i++){const a=nodes[i];
          for(let j=i+1;j<N;j++){const b=nodes[j];
            let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||0.01;
            if(d2>90000)continue;const d=Math.sqrt(d2),f=Math.min(6,900/d2);
            dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}
        for(const[i,j]of edges){const a=nodes[i],b=nodes[j];
          let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1;
          const f=(d-40)*0.02;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
        for(const n of nodes){n.vx+=(W/2-n.x)*0.003;n.vy+=(H/2-n.y)*0.003;
          n.vx*=0.82;n.vy*=0.82;n.x+=n.vx;n.y+=n.vy}
      }
      draw();
      if(iter<300)raf=requestAnimationFrame(tick);
      else document.getElementById('gstat').textContent=`${nodes.length} files • ${edges.length} imports`;
    }
    raf=requestAnimationFrame(tick);
  }
  function draw(){
    g.clearRect(0,0,W,H);g.save();
    g.translate(cam.x,cam.y);g.scale(cam.k,cam.k);g.translate(-W/2,-H/2);
    g.strokeStyle='#CBD5E1';g.lineWidth=0.6/cam.k;g.beginPath();
    for(const[i,j]of edges){g.moveTo(nodes[i].x,nodes[i].y);g.lineTo(nodes[j].x,nodes[j].y)}
    g.stroke();
    for(const n of nodes){g.beginPath();g.arc(n.x,n.y,n.r,0,7);
      g.fillStyle=n===hover?'#111827':COLORS[n.f.status];g.fill()}
    g.restore();
  }
  function toWorld(e){const b=c.getBoundingClientRect();
    return{x:(e.clientX-b.left-cam.x)/cam.k+W/2,y:(e.clientY-b.top-cam.y)/cam.k+H/2}}
  let drag=null,pan=null;
  c.onmousedown=e=>{const p=toWorld(e);
    drag=nodes.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<n.r+3)||null;
    if(!drag)pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}};
  c.onmousemove=e=>{const p=toWorld(e);
    if(drag){drag._moved=true;drag.x=p.x;drag.y=p.y;drag.vx=drag.vy=0;draw()}
    else if(pan){cam.x=pan.cx+e.clientX-pan.x;cam.y=pan.cy+e.clientY-pan.y;draw()}
    else{hover=nodes.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<n.r+3)||null;
      if(hover)showTip(e,hover.f.path+'\n'+hover.f.loc.toLocaleString()+' LOC • '+LABEL[hover.f.status]+
        '\nimports '+files[hover.id].i.length+' • imported by '+hover.f.importedBy);
      else hideTip();
      c.style.cursor=hover?'pointer':'default';draw()}};
  c.onmouseup=e=>{if(drag&&!drag._moved)fileModal(drag.f);drag=null;pan=null};
  c.onmouseleave=()=>{drag=null;pan=null;hideTip()};
  c.onwheel=e=>{e.preventDefault();const k=e.deltaY<0?1.15:0.87;
    cam.k=Math.min(8,Math.max(0.2,cam.k*k));draw()};
  document.getElementById('gd').onchange=rebuild;
  document.getElementById('gt').onchange=rebuild;
  rebuild();
}

// ============ FILES ============
function vFiles(){
  view.innerHTML=`<div class="toolbar">${helpBtn('files')}
    <input type="text" id="fq" placeholder="Search path or filename…" aria-label="Filter files by path">
    ${ORDER.filter(s=>byStatus[s]).map(s=>`<label><input type="checkbox" class="fs" value="${s}" checked> <span class="dot" style="background:${COLORS[s]}"></span>${LABEL[s]}</label>`).join('')}
    <span id="fcount" style="color:var(--muted)" aria-live="polite"></span></div>
    <div class="tablewrap"><table aria-label="All files"><thead><tr>
      <th data-k="path" scope="col">Path</th><th data-k="status" scope="col">Status</th>
      <th data-k="loc" class="num" scope="col">LOC</th><th data-k="bytes" class="num" scope="col">KB</th>
      <th data-k="imp" class="num" scope="col">Imports</th><th data-k="by" class="num" scope="col">Imported by</th></tr></thead>
      <tbody id="fb"></tbody></table></div>
    <div class="note" id="fnote"></div>`;
  let sortK='loc',sortD=-1;
  const tb=document.getElementById('fb');
  function render(){
    const q=document.getElementById('fq').value.toLowerCase();
    const sts=new Set([...document.querySelectorAll('.fs')].filter(x=>x.checked).map(x=>x.value));
    let rows=files.filter(f=>sts.has(f.status)&&(!q||f.path.toLowerCase().includes(q)));
    const key=r=>sortK==='imp'?r.i.length:sortK==='by'?r.importedBy:r[sortK];
    rows.sort((a,b)=>{const x=key(a),y=key(b);return(x<y?-1:x>y?1:0)*sortD});
    document.getElementById('fcount').textContent=rows.length.toLocaleString()+' files';
    view.querySelectorAll('th').forEach(th=>th.setAttribute('aria-sort',th.dataset.k===sortK?(sortD===1?'ascending':'descending'):'none'));
    const lim=rows.slice(0,800);
    tb.innerHTML=lim.map(f=>`<tr data-id="${f.id}" tabindex="0"><td title="${f.path}">${f.path}</td>
      <td><span class="st" style="background:${COLORS[f.status]}">${LABEL[f.status]}</span></td>
      <td class="num">${f.loc.toLocaleString()}</td><td class="num">${(f.bytes/1024).toFixed(0)}</td>
      <td class="num">${f.i.length}</td><td class="num">${f.importedBy}</td></tr>`).join('');
    document.getElementById('fnote').textContent=rows.length>800?'Showing first 800 matches — narrow the search.':'Click a row for file details.';
    tb.querySelectorAll('tr').forEach(tr=>{
      const f=files[+tr.dataset.id];
      tr.onclick=()=>fileModal(f);
      tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileModal(f)}};
    });
  }
  document.getElementById('fq').oninput=render;
  document.querySelectorAll('.fs').forEach(x=>x.onchange=render);
  view.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;
    if(k===sortK)sortD*=-1;else{sortK=k;sortD=k==='path'?1:-1}render()});
  render();
}

// ============ LEARN ============
function vLearn(){
  view.innerHTML=`<div class="toolbar">${helpBtn('learn')}</div>
    <p style="margin-bottom:12px;color:var(--muted)">Every concept the map uses, explained. Click a card.</p>
    <div class="learn-grid">${GLOSSARY.map(g=>`<div class="learn-card" data-t="${g[0]}" tabindex="0" role="button" aria-label="Learn about ${g[1]}">
      <h4>${g[1]}</h4><p>${g[2].replace(/<[^>]+>/g,'').slice(0,110)}…</p></div>`).join('')}</div>`;
  view.querySelectorAll('.learn-card').forEach(c=>{
    c.onclick=()=>openTerm(c.dataset.t);
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTerm(c.dataset.t)}};
  });
}
