name: sda_church_mobile
description: Msabato Church Management System Mobile Application
publish_to: 'none'
version: 1.8.0+17

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

# L770: only packages actually imported under lib/ are declared. The offline
# push/socket sync stack (firebase_messaging, socket_io_client, sqflite,
# web_socket_channel, battery_plus, crypto, flutter_local_notifications) was
# removed along with its dead services — restore from git history when the
# feature ships. Collector SMS reconciliation parses pasted M-Pesa text via
# SmsReconService; an SMS-inbox plugin (another_telephony) is deferred, not
# declared, until the feature is implemented.
dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^12.0.0

  # HTTP & API
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.4.0

  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Forms
  flutter_form_builder: ^9.0.0
  form_builder_validators: ^10.0.0

  # UI Components
  qr_flutter: ^4.1.0

  # Utilities
  logger: ^2.0.0

  # URL Launcher
  url_launcher: ^6.2.0

  # Filesystem paths (imported directly by media_service)
  path_provider: ^2.1.0
  path: ^1.8.3

  # Connectivity
  connectivity_plus: ^5.0.0

  # Biometric Authentication
  local_auth: ^2.1.0

  # Image Picker
  image_picker: ^1.0.0

  # Permissions
  permission_handler: ^11.0.0

  # Device info for real Android SDK checks (media permissions)
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"
