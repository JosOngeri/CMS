name: sda_church_mobile
description: SDA Church Kiserian Main Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296
  go_router: ^12.0.0
  
  # HTTP & API
  dio: ^5.4.0
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  
  # Forms
  flutter_form_builder: ^9.0.0
  form_builder_validators: ^10.0.0
  
  # UI Components
  cached_network_image: ^3.3.0
  
  # Utilities
  logger: ^2.0.0
  crypto: ^3.0.3
  
  # URL Launcher
  url_launcher: ^6.2.0
  
  # Path Provider
  path_provider: ^2.1.0
  
  # Biometric Authentication
  local_auth: ^2.1.0
  
  # Image Picker
  image_picker: ^1.0.0
  
  # Permissions
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"